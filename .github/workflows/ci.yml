name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      WOKI_TEST_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: woki
          POSTGRES_PASSWORD: woki
          POSTGRES_DB: woki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woki -d woki"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './web/*'))"
      - run: go vet ./cmd/... ./cli/... ./internal/... ./pkg/... ./tests/...
      - run: go test ./cmd/... ./cli/... ./internal/... ./pkg/... ./tests/...
      - run: go test -race ./cmd/... ./cli/... ./internal/... ./pkg/... ./tests/...
      - run: go build ./cmd/api ./cli/cmd/woki

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
