name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './web/*'))"
      - run: go vet ./cmd/... ./cli/... ./internal/... ./pkg/... ./tests/...
      - run: go test ./cmd/... ./cli/... ./internal/... ./pkg/... ./tests/...
      - run: go test -race ./cmd/... ./cli/... ./internal/... ./pkg/... ./tests/...
      - run: go build ./cmd/api ./cli/cmd/woki

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
